# Reference deployment: model server (both model endpoints) + orchestrator + Postgres.
# Mirrors production's shape (a model service + an orchestrator + storage).
#
# Published ports bind to 127.0.0.1 only — these are local-dev services, not meant
# to be reachable from other hosts. Postgres is not published at all; only the
# orchestrator reaches it, over the compose network.
#
# Prereq: build the bundle first (see BUILD.md) so ./artifacts/... exists. Then:
#   export POSTGRES_PASSWORD=... GEMINI_API_KEY=...
#   docker compose up --build
#   curl -s localhost:8080/classify -H 'content-type: application/json' \
#        -d '{"title":"fix: null deref","branch":"fix/npe"}'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prworktype
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: prworktype
    # Not published to the host — reached only by the orchestrator on the compose
    # network. Uncomment to inspect locally (still localhost-only):
    # ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prworktype"]
      interval: 5s
      timeout: 3s
      retries: 10

  model-server:
    build: { context: ., dockerfile: server/Dockerfile }
    command: uvicorn server.model_server:app --host 0.0.0.0 --port 8000
    environment:
      BUNDLE_DIR: /bundle
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}     # /llm-classify 503s if unset
    volumes:
      - ./artifacts/model-service/pr-classification/v1:/bundle:ro
    ports: ["127.0.0.1:8000:8000"]

  orchestrator:
    build: { context: ., dockerfile: server/Dockerfile }
    command: uvicorn server.orchestrator:app --host 0.0.0.0 --port 8080
    environment:
      MODEL_SERVER_URL: http://model-server:8000
      DATABASE_URL: postgresql://prworktype:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/prworktype
      TOPK: "0"                                # full taxonomy on escalation (best on this centroid)
    depends_on:
      model-server: { condition: service_started }
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]
